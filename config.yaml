model:
  lidar_features: 180
  speed_embedding_dim: 30
  gru_hidden_size: 420
  mlp_hidden_size: 128
  speed_mask_probability: 0.2
  lidar_normalization_k: 0.3

training:
  batch_size: 128
  learning_rate: 0.001
  num_epochs: 100
  speed_loss_weight: 0.05
  gradient_clip_norm: 1.0

vehicle:
  steering_limit: 0.52
  maximum_speed: 7.5
  wheelbase: 0.33
  length: 0.51
  width: 0.31
  mass: 3.362
  drag_coefficient: 0.0075
  gravity: 9.81

expert:
  tracker_steps: 10
  trajectory_points: 15
  min_time: 0.5
  max_time: 0.91
  time_step: 0.2
  road_width: 1.2
  road_step: 0.3
  target_speed_step: 0.75
  target_speed_samples: 2
  max_acceleration: 20.0
  max_curvature: 1.7
  clearance_radius: 0.45
  jerk_cost: 0.01
  time_cost: 0.1
  speed_cost: 5.0
  lateral_offset_cost: 1.0
  lateral_cost: 1.0
  longitudinal_cost: 1.0
  speed_lookahead_base: 0.5
  min_lookahead: 0.5
  max_lookahead: 1.8
  lookahead_speed_scale: 8.0
  min_steering_gain: 0.5
  max_steering_gain: 0.8
  steering_speed_scale: 8.0
  steering_derivative_gain: 0.2
  interpolation_points: 10
  fallback_min_distance: 0.6
  fallback_time: 0.25
  fallback_speed_reduction: 2.5
