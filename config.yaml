model:
  lidar_features: 180
  speed_embedding_dim: 30
  gru_hidden_size: 420
  mlp_hidden_size: 128
  speed_mask_probability: 0.2
  lidar_normalization_k: 0.3

training:
  batch_size: 128
  learning_rate: 0.001
  num_epochs: 100
  speed_loss_weight: 0.05
  gradient_clip_norm: 1.0

vehicle:
  steering_limit: 0.52
  maximum_speed: 7.5
  width: 0.31
  mass: 3.362
  drag_coefficient: 0.0075

expert:
  tracker_steps: 10
  trajectory_points: 15
  horizon: 0.6
  time_step: 0.1
  road_width: 0.8
  road_step: 0.2
  minimum_terminal_speed: 1.0
  max_acceleration: 7.51
  max_lateral_acceleration: 10.29
  max_curvature: 1.35
  soft_collision_clearance: 0.5
  collision_cost_weight: 4.5
  collision_cost_power: 2.0
  min_lookahead: 0.5
  max_lookahead: 2.5
  lookahead_speed_scale: 8.0
  steering_gain: 0.8
  interpolation_points: 10
